<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contracts | BattleTech Campaign</title>
  <link rel="stylesheet" href="styles.css?v=descriptions-1">
  <script src="supabase/vendor/supabase-js-2.119.2.js" defer></script>
  <script src="supabase/campaign-api.js?v=objective-details-1" defer></script>
  <script src="rules/vendor/markdown-it-15.0.3.min.js" defer></script>
  <script src="formatting.js?v=descriptions-1" defer></script>
  <script src="contracts.js?v=descriptions-1" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="index.html" aria-label="BattleTech Campaign home">
        <span class="insignia" aria-hidden="true"><i></i></span>
        <span>BattleTech <small>Campaign</small></span>
      </a>
      <div class="topbar-actions"><a class="button" href="index.html">Hub</a></div>
    </div>
  </header>

  <main id="contracts-page" class="shell hub-shell">
    <section class="sheet-header" aria-labelledby="contracts-title">
      <h1 id="contracts-title">Contracts</h1>
    </section>

    <section id="current-contract" class="hub-panel current-contract" aria-labelledby="current-title" hidden>
      <div class="contract-section-header">
        <div>
          <h2 id="current-title">Current Contract</h2>
          <h3 id="current-name" tabindex="-1"></h3>
        </div>
        <div id="current-actions" class="contract-actions" hidden>
          <button id="edit-current" type="button">Edit</button>
          <button id="clear-current" type="button">Clear current</button>
        </div>
      </div>
      <p id="current-reward" class="contract-reward"></p>
      <div id="current-briefing" class="contract-briefing formatted-text"></div>
      <div id="current-objectives"></div>
    </section>

    <section class="hub-panel" aria-labelledby="available-title">
      <div class="contract-section-header">
        <h2 id="available-title" tabindex="-1">Available Contracts</h2>
        <button id="new-contract" class="primary" type="button" hidden>New contract</button>
      </div>
      <div id="contract-list" class="contract-list"></div>
      <p id="empty-contracts" class="contract-empty" hidden>No contracts are available.</p>
    </section>
    <p id="contract-status" class="hub-status" role="status">Loading contracts…</p>
  </main>

  <dialog id="contract-dialog" aria-labelledby="contract-editor-title">
    <form id="contract-form" class="dialog-body contract-editor">
      <h2 id="contract-editor-title">New contract</h2>
      <label>Title <input name="title" required maxlength="100"></label>
      <div class="formatted-writing">
        <label for="contract-briefing-input">Briefing</label>
        <textarea id="contract-briefing-input" name="briefing" rows="6" required></textarea>
      </div>
      <label>Reward (SP) <input name="reward" type="number" inputmode="numeric" min="0" max="9007199254740991" step="1" value="0" required></label>
      <p id="contract-form-status" class="hub-status" role="status"></p>
      <div class="dialog-actions">
        <button id="cancel-contract" type="button">Cancel</button>
        <button class="primary" type="submit">Save contract</button>
      </div>
    </form>
  </dialog>

  <dialog id="objective-dialog" aria-labelledby="objective-editor-title">
    <form id="objective-editor" class="dialog-body contract-editor">
      <h2 id="objective-editor-title">New objective</h2>
      <label>Title <input name="title" required maxlength="180"></label>
      <div class="formatted-writing">
        <label for="objective-description-input">Description</label>
        <textarea id="objective-description-input" name="description" rows="4"></textarea>
      </div>
      <div class="formatted-writing">
        <label for="objective-rule-input">Special rule (optional)</label>
        <textarea id="objective-rule-input" name="rule" rows="3"></textarea>
      </div>
      <div class="formatted-writing">
        <label for="objective-reward-input">Completion reward (optional)</label>
        <textarea id="objective-reward-input" name="reward" rows="2" placeholder="e.g. 2 SP"></textarea>
      </div>
      <p id="objective-editor-status" class="hub-status" role="status"></p>
      <div class="dialog-actions">
        <button id="cancel-objective" type="button">Cancel</button>
        <button type="submit" class="primary">Save objective</button>
      </div>
    </form>
  </dialog>

  <template id="offer-template">
    <details class="rule-topic" name="contract-offers">
      <summary><span class="offer-title"></span><span class="offer-visibility" hidden></span></summary>
      <div class="rule-content">
        <p class="contract-reward"></p>
        <div class="contract-briefing formatted-text"></div>
        <div class="contract-actions" hidden>
          <button class="offer-edit" type="button">Edit</button>
          <button class="offer-visibility-toggle" type="button"></button>
          <button class="offer-activate primary" type="button">Set as current</button>
        </div>
      </div>
    </details>
  </template>

  <template id="objective-template">
    <li class="objective-card">
      <h4></h4>
      <div class="objective-description formatted-text" hidden></div>
      <div class="objective-rule" hidden><strong>Special rule</strong><div class="formatted-text"></div></div>
      <div class="objective-reward" hidden><strong>Completion reward</strong><div class="formatted-text"></div></div>
      <div class="objective-controls">
        <span class="objective-status"><span class="objective-mark" aria-hidden="true"></span><span class="objective-state"></span></span>
        <span class="objective-visibility" hidden></span>
        <div class="objective-actions" hidden>
          <select>
            <option value="active">Active</option>
            <option value="completed">Completed</option>
            <option value="lost">Lost</option>
          </select>
          <button type="button" class="objective-edit">Edit</button>
          <button type="button" class="objective-toggle"></button>
        </div>
      </div>
    </li>
  </template>
  <template id="objectives-template">
    <div class="contract-objectives">
      <div class="panel-heading">
        <h3>Objectives</h3>
        <button type="button" class="add-objective" hidden>Add objective</button>
      </div>
      <p class="objective-note" hidden>Players see revealed objectives only while this contract is current.</p>
      <ul class="objective-list"></ul>
      <p class="contract-empty" hidden></p>
    </div>
  </template>
</body>
</html>
