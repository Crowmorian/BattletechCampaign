<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player sheet | BattleTech Campaign</title>
  <link rel="stylesheet" href="styles.css?v=table-overview-1">
  <script src="supabase/vendor/supabase-js-2.119.2.js" defer></script>
  <script src="supabase/campaign-api.js?v=supabase-1" defer></script>
  <script src="company-icons.js?v=table-overview-2" defer></script>
  <script src="app.js?v=table-overview-1" defer></script>
  <script src="rules/vendor/markdown-it-15.0.3.min.js" defer></script>
  <script src="rules/hub.js?v=alpha-strike-2" defer></script>
  <script src="refresh.js?v=table-overview-1" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="index.html" aria-label="BattleTech Campaign home">
        <span class="insignia" aria-hidden="true"><i></i></span>
        <span>BattleTech <small>Campaign</small></span>
      </a>
      <div class="topbar-actions">
        <button type="button" id="rules-button" class="quiet" aria-haspopup="dialog">Rules</button>
        <button type="button" data-refresh>Refresh</button>
        <a class="button" href="index.html">Hub</a>
      </div>
    </div>
  </header>

  <main class="shell">
    <div id="sheet" hidden>
      <section class="sheet-header" aria-labelledby="group-name">
        <div class="group company-heading">
          <img class="company-icon" src="Assets/mech_icon.png" width="64" height="64" alt="">
          <div>
            <p id="sheet-mode" class="eyebrow">Player sheet</p>
            <h1 id="group-name"></h1>
          </div>
        </div>
        <form id="supply-form" class="supply">
          <label for="supply">Supply points <span>SP</span></label>
          <div class="supply-entry">
            <input id="supply" type="number" step="1" required>
            <button type="submit">Save</button>
          </div>
        </form>
        <div class="supply" id="supply-readout" hidden>
          <p>Supply points <span>SP</span></p>
          <output id="supply-balance"></output>
        </div>
      </section>

      <section class="roster" aria-labelledby="roster-title">
        <div class="section-header">
          <div>
            <h2 id="roster-title">Unit roster</h2>
            <p id="roster-count"></p>
          </div>
          <button id="add-unit" type="button" class="primary"><span aria-hidden="true">+</span> Add unit</button>
        </div>
        <div id="unit-list" class="unit-list"></div>
        <p id="empty-roster" class="empty" hidden>Your roster is empty. Add a unit to get started.</p>
      </section>
    </div>

    <footer><span id="save-status" role="status">Loading roster…</span></footer>
  </main>

  <dialog id="rules-dialog" class="rules-hub" aria-labelledby="rules-title">
    <header class="rules-header">
      <h2 id="rules-title">Rules</h2>
      <form method="dialog"><button type="submit">Close</button></form>
    </header>
    <div class="rules-reader" data-rules-reader></div>
  </dialog>

  <dialog id="unit-dialog" aria-labelledby="editor-title">
    <form id="unit-form" class="dialog-body">
      <h2 id="editor-title">Add unit</h2>
      <div class="form-grid">
        <label>Chassis <input name="chassis" required maxlength="48"></label>
        <label>Variant <input name="variant" required maxlength="32"></label>
        <label class="wide">Unit type
          <select name="type"><option value="mech">’Mech</option><option value="vehicle">Vehicle</option><option value="air">Air unit</option></select>
        </label>
        <div class="track-field">
          <label for="armor-total">Total armor</label>
          <div class="number-stepper">
            <button type="button" data-step="-1" aria-label="Decrease total armor">−</button>
            <input id="armor-total" name="armorTotal" type="number" inputmode="numeric" min="0" max="300" step="1" required>
            <button type="button" data-step="1" aria-label="Increase total armor">+</button>
          </div>
        </div>
        <div class="track-field">
          <label for="armor-remaining">Remaining armor</label>
          <div class="number-stepper">
            <button type="button" data-step="-1" aria-label="Decrease remaining armor">−</button>
            <input id="armor-remaining" name="armorRemaining" type="number" inputmode="numeric" min="0" step="1" required>
            <button type="button" data-step="1" aria-label="Increase remaining armor">+</button>
          </div>
        </div>
        <div class="track-field">
          <label for="structure-total">Total structure</label>
          <div class="number-stepper">
            <button type="button" data-step="-1" aria-label="Decrease total structure">−</button>
            <input id="structure-total" name="structureTotal" type="number" inputmode="numeric" min="0" max="300" step="1" required>
            <button type="button" data-step="1" aria-label="Increase total structure">+</button>
          </div>
        </div>
        <div class="track-field">
          <label for="structure-remaining">Remaining structure</label>
          <div class="number-stepper">
            <button type="button" data-step="-1" aria-label="Decrease remaining structure">−</button>
            <input id="structure-remaining" name="structureRemaining" type="number" inputmode="numeric" min="0" step="1" required>
            <button type="button" data-step="1" aria-label="Increase remaining structure">+</button>
          </div>
        </div>
      </div>
      <fieldset class="critical-editor">
        <legend>Critical hits</legend>
        <ul id="critical-options" class="critical-list"></ul>
        <p class="legacy-criticals" hidden></p>
      </fieldset>
      <label class="check"><input name="inoperable" type="checkbox"> Inoperable</label>
      <p id="unit-form-status" role="status"></p>
      <div class="dialog-actions">
        <button type="button" id="remove-unit" class="danger" hidden>Remove unit</button>
        <button type="button" id="cancel-editor">Cancel</button>
        <button type="submit" class="primary">Save unit</button>
      </div>
    </form>
  </dialog>

  <dialog id="remove-dialog" aria-labelledby="remove-title">
    <div class="dialog-body">
      <h2 id="remove-title">Remove unit?</h2>
      <p id="remove-description"></p>
      <form method="dialog" class="dialog-actions">
        <button value="cancel" autofocus>Cancel</button>
        <button value="remove" class="danger">Remove unit</button>
      </form>
    </div>
  </dialog>

  <template id="unit-template">
    <article class="unit-card">
      <div class="unit-identity">
        <img class="unit-icon" width="84" height="84" alt="">
        <div class="unit-title"><p class="unit-variant"></p><h3></h3></div>
      </div>
      <div class="unit-details">
        <div class="track armor"><div class="track-label"><span>Armor</span><span class="track-count"></span></div><div class="pips" aria-hidden="true"></div></div>
        <div class="track structure"><div class="track-label"><span>Structure</span><span class="track-count"></span></div><div class="pips" aria-hidden="true"></div></div>
        <div class="criticals"><h4>Critical hits</h4><ul class="critical-list"></ul><p class="legacy-criticals" hidden></p></div>
      </div>
      <div class="card-actions">
        <label class="check"><input type="checkbox"> Inoperable</label>
        <button type="button">Edit</button>
      </div>
      <p class="unit-status" hidden></p>
    </article>
  </template>

  <template id="critical-row-template">
    <li class="critical-row">
      <span class="critical-name"></span>
      <div class="critical-controls">
        <button type="button" class="critical-minus" hidden>−</button>
        <span class="critical-pips" aria-hidden="true"></span>
        <span class="visually-hidden critical-count"></span>
        <button type="button" class="critical-plus" hidden>+</button>
      </div>
      <span class="critical-effect"></span>
    </li>
  </template>
</body>
</html>
